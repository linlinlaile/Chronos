<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学习计划</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            width: 80%;
            margin: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .course-scores {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .course-type {
            margin-bottom: 20px;
        }
        .course-type select {
            padding: 5px;
        }
        .course-type input {
            padding: 5px;
            margin-left: 10px;
        }
        .course-type button {
            padding: 5px 10px;
            margin-left: 10px;
        }
        .course-record {
            margin-top: 20px;
        }
        .course-record table {
            width: 100%;
            border-collapse: collapse;
        }
        .course-record th, .course-record td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .pagination {
            margin-top: 20px;
            text-align: center;
        }
        .pagination a {
            margin: 0 5px;
            text-decoration: none;
        }
        .user-info {
            margin-top: 20px;
            text-align: right;
        }
        .sync-bar {
            margin-bottom: 20px;
            text-align: center;
        }
        .sync-bar button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>创建学习计划</h1>
    </div>

    <div class="course-scores">
        <p>专业课：XX分    一般课：XX分    行业课：XX分</p>
    </div>

    <div class="sync-bar">
        <button>同步</button>
    </div>

    <div class="course-type">
        <label for="courseType1">选择课程类型</label>
        <select id="courseType1">
            <option value="专业课">专业课</option>
            <option value="一般课">一般课</option>
            <option value="行业课">行业课</option>
        </select>
        <input type="text" placeholder="目标分">
        <button>+</button>
    </div>

    <div class="course-type">
        <label for="courseType2">选择课程类型</label>
        <select id="courseType2">
            <option value="专业课">专业课</option>
            <option value="一般课">一般课</option>
            <option value="行业课">行业课</option>
        </select>
        <input type="text" placeholder="目标分">
        <button>+</button>
    </div>

    <button style="display: block; margin: 20px auto; padding: 10px 20px;">开始学习</button>

    <div class="course-record">
        <h2>刷课记录</h2>
        <table>
            <thead>
            <tr>
                <th>课程名称</th>
                <th>课程类型</th>
                <th>课程积分</th>
                <th>时间</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>XXXXXXXX</td>
                <td>专业课</td>
                <td>1</td>
                <td>2025-01-01 12:00:00</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <a href="#">上一页</a>
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <span>…</span>
        <a href="#">10</a>
        <a href="#">下一页</a>
    </div>

    <div class="user-info">
        <p>XXX用户</p>
    </div>
</div>
</body>
</html>
